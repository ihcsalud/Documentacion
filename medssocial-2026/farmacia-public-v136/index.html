<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3f35">
<meta name="robots" content="noindex">
<meta name="description" content="MedsSocial Farmacia 2026: ficha pública, servicios, profesionales, agenda, reservas y actividades.">
<title>MedsSocial · Farmacia pública v136</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fbfaf6}#app{display:block;width:100%;height:100%;border:0;background:#fbfaf6}.boot{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(circle at 14% 0,#e3f5ee,transparent 34%),#fbfaf6;color:#173a33;font:16px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;transition:opacity .25s ease}.boot.hide{opacity:0;pointer-events:none}.boot-card{width:min(520px,calc(100% - 40px));padding:28px;border:1px solid #dce7e2;border-radius:28px;background:#fff;box-shadow:0 22px 64px rgba(18,63,55,.12)}.boot strong{font-size:21px}.bar{height:5px;margin-top:18px;border-radius:99px;overflow:hidden;background:#e5efeb}.bar:after{content:"";display:block;width:45%;height:100%;border-radius:inherit;background:#103f35;animation:move 1s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(122%)}}@media(prefers-reduced-motion:reduce){.bar:after{animation:none}.boot{transition:none}}
</style>
</head>
<body>
<div class="boot" id="boot"><div class="boot-card"><strong>Abriendo tu farmacia…</strong><div class="bar"></div></div></div>
<iframe id="app" title="MedsSocial Farmacia 2026"></iframe>
<script>
const frame=document.getElementById('app'),boot=document.getElementById('boot');
const target='../farmacia-public-v135/index.html'+location.search+location.hash;
frame.src=target;
function injectV136(doc,win){
  if(doc.getElementById('v136-polish'))return;
  const style=doc.createElement('style');
  style.id='v136-polish';
  style.textContent=`
    .v136-desktop-cta{position:fixed;right:22px;bottom:22px;z-index:45;display:flex;align-items:center;gap:14px;padding:12px 14px 12px 18px;border:1px solid rgba(255,255,255,.16);border-radius:22px;background:rgba(15,63,53,.96);color:#fff;box-shadow:0 20px 46px rgba(15,63,53,.28);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
    .v136-desktop-cta small{display:block;color:#cfe5dd;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}.v136-desktop-cta strong{display:block;margin-top:2px;font-size:14px}.v136-desktop-cta button{border:0;border-radius:14px;padding:13px 16px;background:#fff;color:#103f35;font:800 14px Inter,system-ui;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.12)}
    .v136-desktop-cta button:focus-visible{outline:3px solid #b9e6d5;outline-offset:3px}.v136-progress{position:fixed;left:0;top:0;z-index:100;width:100%;height:3px;pointer-events:none;background:linear-gradient(90deg,#b7dfd0 var(--v136-progress,0%),transparent 0)}
    .v136-skip{position:fixed;left:16px;top:-90px;z-index:110;padding:12px 16px;border-radius:12px;background:#103f35;color:#fff;font-weight:800;text-decoration:none}.v136-skip:focus{top:16px}
    @media(max-width:900px){.v136-desktop-cta{display:none}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto!important}.card,.today-card,.quick-shell,.booking,.contact-card{transition:none!important}}
  `;
  doc.head.append(style);
  const progress=doc.createElement('div');progress.className='v136-progress';progress.setAttribute('aria-hidden','true');doc.body.append(progress);
  const skip=doc.createElement('a');skip.className='v136-skip';skip.href='#booking';skip.textContent='Ir a reservar';doc.body.prepend(skip);
  const cta=doc.createElement('aside');cta.className='v136-desktop-cta';cta.setAttribute('aria-label','Acceso rápido a reserva');cta.innerHTML='<div><small>Reserva online</small><strong>Elige servicio y hora</strong></div><button type="button">Reservar ahora</button>';
  cta.querySelector('button').addEventListener('click',()=>{const target=doc.querySelector('#booking,.booking,[data-section="booking"]');if(target){target.scrollIntoView({behavior:'smooth',block:'start'});const focusable=target.querySelector('button,input,select,a[href]');if(focusable)setTimeout(()=>focusable.focus({preventScroll:true}),450)}else{win.location.hash='booking'}});doc.body.append(cta);
  const updateProgress=()=>{const root=doc.documentElement;const max=Math.max(1,root.scrollHeight-root.clientHeight);root.style.setProperty('--v136-progress',Math.min(100,Math.max(0,(root.scrollTop/max)*100)).toFixed(1)+'%')};doc.addEventListener('scroll',updateProgress,{passive:true});updateProgress();doc.documentElement.dataset.frontend='v136';
}
function syncHash(win){try{const h=win.location.hash;if(h!==location.hash)history.replaceState(null,'',location.pathname+location.search+h)}catch{}}
frame.addEventListener('load',()=>{try{const doc=frame.contentDocument,win=frame.contentWindow;injectV136(doc,win);win.addEventListener('hashchange',()=>syncHash(win));syncHash(win);if(doc.title)document.title=doc.title.replace(/v135/i,'v136')}catch(e){console.warn('v136 polish unavailable',e)}boot.classList.add('hide');setTimeout(()=>boot.remove(),300)});
window.addEventListener('hashchange',()=>{try{if(frame.contentWindow.location.hash!==location.hash)frame.contentWindow.location.hash=location.hash}catch{}});
</script>
</body>
</html>
