<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3f35">
<meta name="robots" content="noindex">
<meta name="description" content="MedsSocial Farmacia 2026: ficha pública, servicios, profesionales, agenda, reservas y actividades.">
<title>MedsSocial · Farmacia pública v137</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fbfaf6}#app{display:block;width:100%;height:100%;border:0;background:#fbfaf6}.boot{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(circle at 14% 0,#e3f5ee,transparent 34%),#fbfaf6;color:#173a33;font:16px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;transition:opacity .25s ease}.boot.hide{opacity:0;pointer-events:none}.boot-card{width:min(520px,calc(100% - 40px));padding:28px;border:1px solid #dce7e2;border-radius:28px;background:#fff;box-shadow:0 22px 64px rgba(18,63,55,.12)}.boot strong{font-size:21px}.bar{height:5px;margin-top:18px;border-radius:99px;overflow:hidden;background:#e5efeb}.bar:after{content:"";display:block;width:45%;height:100%;border-radius:inherit;background:#103f35;animation:move 1s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(122%)}}@media(prefers-reduced-motion:reduce){.bar:after{animation:none}.boot{transition:none}}
</style>
</head>
<body>
<div class="boot" id="boot"><div class="boot-card"><strong>Abriendo tu farmacia…</strong><div class="bar"></div></div></div>
<iframe id="app" title="MedsSocial Farmacia 2026"></iframe>
<script>
const frame=document.getElementById('app'),boot=document.getElementById('boot');
const target='../farmacia-public-v136/index.html'+location.search+location.hash;
frame.src=target;
function injectV137(doc,win){
  if(doc.getElementById('v137-confidence'))return;
  const style=doc.createElement('style');style.id='v137-confidence';style.textContent=`.v137-confidence{padding:14px 0 42px}.v137-confidence-shell{width:min(1180px,calc(100% - 40px));margin:auto;padding:24px;border:1px solid #dce7e2;border-radius:28px;background:linear-gradient(135deg,#103f35 0%,#174f43 58%,#1d5f50 100%);color:#fff;box-shadow:0 24px 54px rgba(15,63,53,.14)}.v137-confidence-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:20px}.v137-eyebrow{margin:0 0 8px;color:#bfe4d6;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}.v137-confidence h2{margin:0;max-width:650px;font-size:clamp(28px,3.4vw,44px);line-height:1.02;letter-spacing:-.035em}.v137-confidence-head p{max-width:390px;margin:0;color:#d7ebe4;font-size:14px;line-height:1.6}.v137-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.v137-step{padding:18px;border:1px solid rgba(255,255,255,.13);border-radius:20px;background:rgba(255,255,255,.075)}.v137-num{display:grid;place-items:center;width:34px;height:34px;margin-bottom:14px;border-radius:11px;background:#fff;color:#103f35;font-weight:900;font-size:13px}.v137-step strong{display:block;margin-bottom:6px;font-size:16px}.v137-step span{display:block;color:#d8ebe4;font-size:13px;line-height:1.5}.v137-confidence-actions{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:18px;padding-top:18px;border-top:1px solid rgba(255,255,255,.12)}.v137-privacy{display:flex;align-items:center;gap:9px;color:#d8ebe4;font-size:12px}.v137-privacy:before{content:'✓';display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.13);color:#fff;font-weight:900}.v137-book{border:0;border-radius:14px;padding:13px 18px;background:#fff;color:#103f35;font:800 14px Inter,system-ui;cursor:pointer}@media(max-width:760px){.v137-confidence{padding:6px 0 30px}.v137-confidence-shell{width:min(100% - 24px,1180px);padding:19px;border-radius:24px}.v137-confidence-head{display:block}.v137-confidence-head p{margin-top:12px}.v137-steps{grid-template-columns:1fr}.v137-step{display:grid;grid-template-columns:42px 1fr;column-gap:10px;padding:14px}.v137-num{grid-row:1/3;margin:0}.v137-step strong,.v137-step span{grid-column:2}.v137-confidence-actions{align-items:stretch;flex-direction:column}.v137-book{min-height:46px;width:100%}}`;doc.head.append(style);
  const section=doc.createElement('section');section.className='v137-confidence';section.setAttribute('aria-label','Cómo funciona la reserva online');section.innerHTML=`<div class="v137-confidence-shell"><div class="v137-confidence-head"><div><p class="v137-eyebrow">Tu farmacia, sin esperas innecesarias</p><h2>Reserva online y llega con todo preparado.</h2></div><p>Una experiencia sencilla para elegir la atención que necesitas, encontrar una hora y gestionar después tu cita sin llamadas.</p></div><div class="v137-steps"><article class="v137-step"><span class="v137-num">01</span><strong>Elige el servicio</strong><span>Consulta qué ofrece esta farmacia y selecciona exactamente lo que necesitas.</span></article><article class="v137-step"><span class="v137-num">02</span><strong>Escoge una hora</strong><span>Accede a disponibilidad real y reserva el hueco que mejor encaje contigo.</span></article><article class="v137-step"><span class="v137-num">03</span><strong>Gestiona tu cita</strong><span>Vuelve cuando quieras para consultar, añadir al calendario o cancelar tu reserva.</span></article></div><div class="v137-confidence-actions"><div class="v137-privacy">Tus datos personales se solicitan únicamente al confirmar la reserva.</div><button class="v137-book" type="button">Reservar ahora</button></div></div>`;
  section.querySelector('.v137-book').addEventListener('click',()=>{const booking=doc.querySelector('#booking,.booking,[data-section="booking"]');if(booking){booking.scrollIntoView({behavior:'smooth',block:'start'});const focusable=booking.querySelector('button,input,select,a[href]');if(focusable)setTimeout(()=>focusable.focus({preventScroll:true}),400)}else win.location.hash='booking'});
  const anchor=doc.querySelector('.quick')||doc.querySelector('.intent')||doc.querySelector('.today');if(anchor&&anchor.parentNode)anchor.parentNode.insertBefore(section,anchor.nextSibling);else doc.body.append(section);doc.documentElement.dataset.frontend='v137';
}
function syncHash(win){try{const h=win.location.hash;if(h!==location.hash)history.replaceState(null,'',location.pathname+location.search+h)}catch{}}
frame.addEventListener('load',()=>{try{const doc=frame.contentDocument,win=frame.contentWindow;injectV137(doc,win);win.addEventListener('hashchange',()=>syncHash(win));syncHash(win);const title=doc.title;if(title)document.title=title.replace(/v136/i,'v137')}catch(e){console.warn('v137 confidence unavailable',e)}boot.classList.add('hide');setTimeout(()=>boot.remove(),300)});
window.addEventListener('hashchange',()=>{try{if(frame.contentWindow.location.hash!==location.hash)frame.contentWindow.location.hash=location.hash}catch{}});
</script>
</body>
</html>
