<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f3f35"><meta name="robots" content="noindex"><meta name="description" content="MedsSocial Farmacia 2026: ficha pública, servicios, profesionales, agenda, reservas, actividades y contacto."><title>MedsSocial · Farmacia pública v146</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fbfaf6}#app{display:block;width:100%;height:100%;border:0}.boot{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#fbfaf6;color:#173a33;font:16px Inter,system-ui,sans-serif}.boot-card{width:min(520px,calc(100% - 40px));padding:28px;border:1px solid #dce7e2;border-radius:28px;background:#fff;box-shadow:0 22px 64px rgba(18,63,55,.12)}.boot.hide{display:none}</style></head><body><div class="boot" id="boot"><div class="boot-card"><strong>Abriendo tu farmacia…</strong><p>Preparando servicios, equipo y reserva online.</p></div></div><iframe id="app" title="MedsSocial Farmacia 2026"></iframe><script>
const frame=document.getElementById('app'),boot=document.getElementById('boot');frame.src='../farmacia-public-v143/index.html'+location.search+location.hash;
function leaf(){let w=frame.contentWindow;for(let i=0;i<24;i++){try{const f=w.document.querySelector('iframe#app,iframe');if(!f?.contentWindow)break;w=f.contentWindow}catch(e){break}}return w}
function pick(d,a){for(const s of a){const e=d.querySelector(s);if(e)return e}return null}function clean(v){return String(v||'').replace(/\s+/g,' ').trim()}
function findLink(d,patterns){for(const p of patterns){const e=[...d.querySelectorAll('a[href]')].find(a=>p.test(a.getAttribute('href')||'')||p.test(a.textContent||''));if(e)return e}return null}
function injectActions(d){if(d.getElementById('v146-actions'))return;const booking=pick(d,['#booking','.booking','[data-section="booking"]','#availability','.availability']),services=pick(d,['#services','.services','[data-section="services"]']),phone=findLink(d,[/^tel:/i,/llamar|tel[eé]fono/i]),wa=findLink(d,[/wa\.me|whatsapp/i]),maps=findLink(d,[/google\.[^/]+\/maps|maps\.app|maps\?|como llegar|cómo llegar/i]);const actions=[];if(booking)actions.push({k:'Reserva',t:'Reservar online',s:'Elige servicio y hora disponible',target:booking,p:1});if(phone)actions.push({k:'Teléfono',t:'Llamar a la farmacia',s:'Contacto directo',href:phone.href});if(wa)actions.push({k:'WhatsApp',t:'Escribir por WhatsApp',s:'Consulta rápida',href:wa.href});if(maps)actions.push({k:'Ubicación',t:'Cómo llegar',s:'Abrir indicaciones',href:maps.href});if(actions.length<2&&services)actions.push({k:'Servicios',t:'Ver servicios',s:'Consulta lo que ofrece esta farmacia',target:services});if(!actions.length)return;const st=d.createElement('style');st.textContent='.v146-actions{width:min(1180px,calc(100% - 40px));margin:8px auto 34px;color:#173a33}.v146-shell{display:grid;grid-template-columns:minmax(220px,.72fr) 1.6fr;gap:18px;padding:18px;border:1px solid #d8e5df;border-radius:26px;background:linear-gradient(135deg,#f1f8f5,#fff 52%,#fbfaf6);box-shadow:0 18px 48px rgba(17,63,53,.075)}.v146-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}.v146-action{display:flex;min-height:86px;box-sizing:border-box;flex-direction:column;justify-content:center;align-items:flex-start;gap:4px;padding:14px 15px;border:1px solid #d7e5df;border-radius:17px;background:#fff;color:#17483d;text-decoration:none;text-align:left;cursor:pointer}.v146-action.primary{background:#143f35;border-color:#143f35;color:#fff}.v146-action strong{font:850 13px Inter,system-ui,sans-serif}.v146-action small,.v146-copy{font:600 11px/1.4 Inter,system-ui,sans-serif;opacity:.68}.v146-kicker{font:900 10px Inter,system-ui,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:#2b6b5b}.v146-title{margin:7px 0;font:850 clamp(20px,2vw,27px)/1.08 Inter,system-ui,sans-serif}@media(max-width:800px){.v146-actions{width:calc(100% - 24px)}.v146-shell{grid-template-columns:1fr;padding:16px}.v146-grid{display:flex;overflow:auto;scroll-snap-type:x mandatory}.v146-action{flex:0 0 min(76vw,250px);scroll-snap-align:start}}';d.head.append(st);const sec=d.createElement('section');sec.id='v146-actions';sec.className='v146-actions';sec.innerHTML='<div class="v146-shell"><div><div class="v146-kicker">Accesos rápidos</div><h2 class="v146-title">Tu farmacia, a un toque</h2><p class="v146-copy">Reserva, contacta o llega sin perder tiempo.</p></div><div class="v146-grid"></div></div>';const grid=sec.querySelector('.v146-grid');actions.slice(0,4).forEach(a=>{const e=a.href?d.createElement('a'):d.createElement('button');e.className='v146-action'+(a.p?' primary':'');if(a.href){e.href=a.href;if(!/^tel:/i.test(a.href)){e.target='_blank';e.rel='noopener'}}else{e.type='button';e.onclick=()=>a.target?.scrollIntoView({behavior:'smooth',block:'start'})}e.innerHTML='<span style="font:900 9px Inter,sans-serif;letter-spacing:.11em;text-transform:uppercase;opacity:.62">'+a.k+'</span><strong>'+a.t+'</strong><small>'+a.s+'</small>';grid.append(e)});const nav=d.getElementById('v143-nav'),hero=pick(d,['main .hero','.hero','main section','header']);if(nav?.parentNode)nav.parentNode.insertBefore(sec,nav.nextSibling);else if(hero?.parentNode)hero.parentNode.insertBefore(sec,hero.nextSibling);else d.body.prepend(sec)}
function injectSummary(d){if(d.getElementById('v146-summary'))return;const b=pick(d,['#booking','.booking','[data-section="booking"]','#availability','.availability','[id*="reserva"]']);if(!b)return;const st=d.createElement('style');st.textContent='.v146-summary{margin:0 0 18px;padding:16px;border:1px solid #cfe1da;border-radius:20px;background:linear-gradient(135deg,#f0f8f4,#fff 68%);color:#173a33}.v146-sgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:13px}.v146-sitem{padding:10px;border:1px solid #dce8e3;border-radius:13px;background:#fff}.v146-sitem span{display:block;font:800 8px Inter,sans-serif;text-transform:uppercase;color:#8a9994}.v146-sitem strong{font:800 11px Inter,sans-serif;color:#214a40}@media(max-width:720px){.v146-sgrid{grid-template-columns:1fr 1fr}}';d.head.append(st);const p=d.createElement('aside');p.id='v146-summary';p.className='v146-summary';p.setAttribute('aria-live','polite');p.innerHTML='<strong>Resumen de tu cita</strong><div class="v146-sgrid"><div class="v146-sitem"><span>Servicio</span><strong data-x="service">Por elegir</strong></div><div class="v146-sitem"><span>Profesional</span><strong data-x="professional">Cualquiera</strong></div><div class="v146-sitem"><span>Fecha</span><strong data-x="date">Por elegir</strong></div><div class="v146-sitem"><span>Hora</span><strong data-x="time">Por elegir</strong></div></div>';b.prepend(p);const params=new URLSearchParams(location.search);function val(rx){for(const e of b.querySelectorAll('select,input')){const hay=(e.name||'')+' '+(e.id||'')+' '+(e.getAttribute('aria-label')||'');if(!rx.test(hay))continue;if(e.tagName==='SELECT'){const x=clean(e.selectedOptions?.[0]?.textContent);if(x&&!/elige|selecciona|cualquiera|todos/i.test(x))return x}else if(e.value)return clean(e.value)}return''}function chosenTime(){for(const e of b.querySelectorAll('button[aria-pressed="true"],button.active,button.selected,[data-selected="true"]')){const m=clean(e.textContent).match(/\b([01]?\d|2[0-3]):[0-5]\d\b/);if(m)return m[0]}return''}function update(){const data={service:val(/service|servicio/i)||clean(params.get('service')),professional:val(/professional|profesional/i)||clean(params.get('professional'))||'Cualquiera',date:val(/date|fecha/i)||clean(params.get('date')),time:chosenTime()||clean(params.get('slot'))};for(const k of Object.keys(data)){p.querySelector('[data-x="'+k+'"]').textContent=data[k]||'Por elegir'}}b.addEventListener('change',update);b.addEventListener('click',()=>setTimeout(update,50));new MutationObserver(update).observe(b,{subtree:true,attributes:true,childList:true});update()}
function attempt(n=0){try{const d=leaf().document;if(d&&d.readyState!=='loading'){injectActions(d);injectSummary(d);d.documentElement.dataset.frontend='v146';boot.classList.add('hide');return}}catch(e){}if(n<200)setTimeout(()=>attempt(n+1),100);else boot.classList.add('hide')}frame.addEventListener('load',()=>attempt());
</script></body></html>
