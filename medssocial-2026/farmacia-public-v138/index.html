<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3f35">
<meta name="robots" content="noindex">
<meta name="description" content="MedsSocial Farmacia 2026: ficha pública, servicios, profesionales, agenda, reservas y actividades.">
<title>MedsSocial · Farmacia pública v138</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fbfaf6}#app{display:block;width:100%;height:100%;border:0;background:#fbfaf6}.boot{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(circle at 14% 0,#e3f5ee,transparent 34%),#fbfaf6;color:#173a33;font:16px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;transition:opacity .25s ease}.boot.hide{opacity:0;pointer-events:none}.boot-card{width:min(520px,calc(100% - 40px));padding:28px;border:1px solid #dce7e2;border-radius:28px;background:#fff;box-shadow:0 22px 64px rgba(18,63,55,.12)}.boot strong{font-size:21px}.bar{height:5px;margin-top:18px;border-radius:99px;overflow:hidden;background:#e5efeb}.bar:after{content:"";display:block;width:45%;height:100%;border-radius:inherit;background:#103f35;animation:move 1s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(122%)}}@media(prefers-reduced-motion:reduce){.bar:after{animation:none}.boot{transition:none}}
</style>
</head>
<body>
<div class="boot" id="boot"><div class="boot-card"><strong>Abriendo tu farmacia…</strong><div class="bar"></div></div></div>
<iframe id="app" title="MedsSocial Farmacia 2026"></iframe>
<script>
const frame=document.getElementById('app'),boot=document.getElementById('boot');
const target='../farmacia-public-v137/index.html'+location.search+location.hash;
frame.src=target;
function injectV138(doc,win){
  if(doc.getElementById('v138-visit'))return;
  const style=doc.createElement('style');
  style.id='v138-visit';
  style.textContent=`
    .v138-visit{padding:10px 0 54px}.v138-shell{width:min(1180px,calc(100% - 40px));margin:auto;display:grid;grid-template-columns:.82fr 1.18fr;gap:28px;padding:30px;border:1px solid #dce7e2;border-radius:30px;background:#fff;box-shadow:0 22px 58px rgba(20,59,52,.08)}
    .v138-copy{padding:6px}.v138-kicker{margin:0 0 10px;color:#2e7565;font-size:12px;font-weight:850;letter-spacing:.09em;text-transform:uppercase}.v138-copy h2{margin:0;color:#123e35;font-size:clamp(29px,3.5vw,46px);line-height:1.02;letter-spacing:-.04em}.v138-copy>p{margin:16px 0 22px;color:#63736e;font-size:15px;line-height:1.65}.v138-trust{display:grid;gap:9px}.v138-trust span{display:flex;gap:10px;align-items:flex-start;color:#38574f;font-size:13px;line-height:1.45}.v138-trust span:before{content:'✓';flex:0 0 auto;display:grid;place-items:center;width:21px;height:21px;border-radius:50%;background:#e6f3ee;color:#155344;font-size:11px;font-weight:900}.v138-faq{display:grid;align-content:start;gap:10px}.v138-faq details{border:1px solid #dce7e2;border-radius:17px;background:#fbfcfa;overflow:hidden}.v138-faq details[open]{background:#f5faf7;border-color:#c8ddd5}.v138-faq summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:17px 18px;color:#173f36;font-size:14px;font-weight:800;cursor:pointer}.v138-faq summary::-webkit-details-marker{display:none}.v138-faq summary:after{content:'+';display:grid;place-items:center;width:28px;height:28px;flex:0 0 28px;border-radius:9px;background:#e7f1ed;color:#174f43;font-size:18px;font-weight:500;transition:transform .2s ease}.v138-faq details[open] summary:after{content:'–';transform:rotate(180deg)}.v138-answer{padding:0 18px 17px;color:#60716c;font-size:13px;line-height:1.62}.v138-actions{display:flex;gap:10px;margin-top:22px}.v138-primary,.v138-secondary{min-height:46px;border-radius:14px;padding:0 17px;font:800 13px Inter,system-ui;cursor:pointer}.v138-primary{border:0;background:#103f35;color:white}.v138-secondary{border:1px solid #cbdcd6;background:white;color:#174c41}.v138-primary:focus-visible,.v138-secondary:focus-visible,.v138-faq summary:focus-visible{outline:3px solid #b8e1d3;outline-offset:3px}
    @media(max-width:820px){.v138-visit{padding:4px 0 36px}.v138-shell{width:min(100% - 24px,1180px);grid-template-columns:1fr;gap:22px;padding:20px;border-radius:24px}.v138-copy{padding:0}.v138-actions{display:grid;grid-template-columns:1fr 1fr}.v138-faq summary{min-height:48px;padding:15px}.v138-answer{padding:0 15px 15px}}
    @media(max-width:430px){.v138-actions{grid-template-columns:1fr}.v138-shell{padding:18px}.v138-copy>p{font-size:14px}}
    @media(prefers-reduced-motion:reduce){.v138-faq summary:after{transition:none}}
  `;
  doc.head.append(style);
  const section=doc.createElement('section');
  section.id='v138-visit';section.className='v138-visit';section.setAttribute('aria-labelledby','v138-title');
  section.innerHTML=`<div class="v138-shell"><div class="v138-copy"><p class="v138-kicker">Antes de tu visita</p><h2 id="v138-title">Todo claro antes de venir.</h2><p>Reserva, consulta y gestiona tu atención desde la misma ficha de farmacia. Sin crear una cuenta y sin depender de una llamada.</p><div class="v138-trust"><span>La disponibilidad que ves procede de la agenda de la farmacia.</span><span>Tu reserva puede consultarse después desde “Mi cita”.</span><span>El borrador de reserva no guarda nombre, email ni teléfono.</span></div><div class="v138-actions"><button class="v138-primary" type="button">Ver horas disponibles</button><button class="v138-secondary" type="button">Ir a Mi cita</button></div></div><div class="v138-faq" aria-label="Preguntas frecuentes"><details><summary>¿Puedo reservar para hoy?</summary><div class="v138-answer">Si la farmacia tiene huecos disponibles para hoy, aparecerán en “Próximas horas disponibles” y podrás reservarlos directamente.</div></details><details><summary>¿Necesito registrarme para reservar?</summary><div class="v138-answer">No. La reserva se confirma con tus datos de contacto y después puedes recuperarla desde “Mi cita” mediante el acceso privado guardado en este dispositivo.</div></details><details><summary>¿Puedo cancelar la cita online?</summary><div class="v138-answer">Sí. Abre “Mi cita” desde esta farmacia y, cuando la reserva permita cancelación, podrás hacerlo online sin llamar.</div></details><details><summary>¿Qué pasa si cierro la web a mitad de una reserva?</summary><div class="v138-answer">Durante unas horas conservamos únicamente el servicio, profesional, fecha, hora y paso en el que estabas. No se guardan en ese borrador tu nombre, email ni teléfono.</div></details><details><summary>¿Puedo añadir la cita a mi calendario?</summary><div class="v138-answer">Sí. Una vez confirmada, “Mi cita” permite descargarla en formato de calendario para guardarla en tu dispositivo.</div></details></div></div>`;
  const go=(selectors)=>{for(const s of selectors){const el=doc.querySelector(s);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});const f=el.querySelector('button,input,select,a[href]')||el;if(f&&f.focus)setTimeout(()=>f.focus({preventScroll:true}),350);return true}}return false};
  section.querySelector('.v138-primary').addEventListener('click',()=>{if(!go(['.slots','.next-slots','#booking','.booking','[data-section="booking"]']))win.location.hash='booking'});
  section.querySelector('.v138-secondary').addEventListener('click',()=>{if(!go(['#my-booking','.my-booking','.my-appointment','[data-section="my-booking"]'])){const candidates=[...doc.querySelectorAll('button,a')];const el=candidates.find(x=>/mi cita/i.test(x.textContent||''));if(el)el.click()}});
  const footer=doc.querySelector('footer');
  const content=[...doc.querySelectorAll('section')].find(x=>/consejos de salud/i.test(x.textContent||''));
  const events=[...doc.querySelectorAll('section')].find(x=>/actividades|eventos/i.test(x.textContent||''));
  const anchor=content||events||footer;
  if(anchor&&anchor.parentNode)anchor.parentNode.insertBefore(section,anchor);else doc.body.append(section);
  const faqJson={"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"¿Puedo reservar para hoy?","acceptedAnswer":{"@type":"Answer","text":"Si la farmacia tiene huecos disponibles para hoy, aparecerán en Próximas horas disponibles y podrás reservarlos directamente."}},{"@type":"Question","name":"¿Necesito registrarme para reservar?","acceptedAnswer":{"@type":"Answer","text":"No. La reserva se confirma con tus datos de contacto y después puedes recuperarla desde Mi cita mediante el acceso privado guardado en este dispositivo."}},{"@type":"Question","name":"¿Puedo cancelar la cita online?","acceptedAnswer":{"@type":"Answer","text":"Sí. Desde Mi cita puedes cancelar online cuando la reserva lo permita."}}]};
  const ld=doc.createElement('script');ld.type='application/ld+json';ld.id='v138-faq-jsonld';ld.textContent=JSON.stringify(faqJson);doc.head.append(ld);
  doc.documentElement.dataset.frontend='v138';
}
function syncHash(win){try{const h=win.location.hash;if(h!==location.hash)history.replaceState(null,'',location.pathname+location.search+h)}catch{}}
frame.addEventListener('load',()=>{try{const doc=frame.contentDocument,win=frame.contentWindow;injectV138(doc,win);win.addEventListener('hashchange',()=>syncHash(win));syncHash(win);const title=doc.title;if(title)document.title=title.replace(/v137/i,'v138')}catch(e){console.warn('v138 visit guidance unavailable',e)}boot.classList.add('hide');setTimeout(()=>boot.remove(),300)});
window.addEventListener('hashchange',()=>{try{if(frame.contentWindow.location.hash!==location.hash)frame.contentWindow.location.hash=location.hash}catch{}});
</script>
</body>
</html>
