<body>
<div class="boot" id="boot"><div class="boot-card"><strong>Abriendo tu farmacia…</strong><div class="bar"></div></div></div>
<iframe id="app" title="MedsSocial Farmacia 2026"></iframe>
<script>
const frame=document.getElementById('app'),boot=document.getElementById('boot');
const target='../farmacia-public-v137/index.html'+location.search+location.hash;
frame.src=target;
function injectV138(doc,win){
  if(doc.getElementById('v138-faq-style'))return;
  const style=doc.createElement('style');style.id='v138-faq-style';style.textContent=`.v138-faq{padding:18px 0 54px}.v138-faq-shell{width:min(1180px,calc(100% - 40px));margin:auto;display:grid;grid-template-columns:.82fr 1.18fr;gap:34px;padding:30px;border:1px solid #dce7e2;border-radius:30px;background:#fff;box-shadow:0 20px 50px rgba(18,63,55,.07)}.v138-faq-copy{align-self:start;position:sticky;top:24px}.v138-kicker{margin:0 0 10px;color:#2a7766;font-size:12px;font-weight:900;letter-spacing:.09em;text-transform:uppercase}.v138-faq h2{margin:0;color:#153e35;font-size:clamp(30px,3.7vw,48px);line-height:1.02;letter-spacing:-.04em}.v138-intro{margin:16px 0 22px;color:#587069;font-size:15px;line-height:1.65}.v138-book{min-height:46px;border:0;border-radius:14px;padding:13px 18px;background:#103f35;color:#fff;font:800 14px Inter,system-ui;cursor:pointer}.v138-list{display:grid;gap:10px}.v138-item{border:1px solid #dfe9e5;border-radius:18px;background:#fbfcfa;overflow:hidden}.v138-item summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:58px;padding:0 18px;color:#173f36;font-weight:850;cursor:pointer}.v138-item summary::-webkit-details-marker{display:none}.v138-item summary:after{content:'+';flex:0 0 auto;display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:#e8f3ef;color:#195548;font-size:20px;font-weight:600}.v138-item[open] summary:after{content:'–'}.v138-answer{padding:0 18px 18px;color:#5a716a;font-size:14px;line-height:1.65}.v138-note{margin-top:14px;padding:14px 16px;border-radius:16px;background:#edf7f3;color:#315c51;font-size:12px;line-height:1.55}.v138-note strong{color:#143f35}@media(max-width:800px){.v138-faq{padding:8px 0 34px}.v138-faq-shell{width:min(100% - 24px,1180px);grid-template-columns:1fr;gap:20px;padding:20px;border-radius:24px}.v138-faq-copy{position:static}.v138-book{width:100%}.v138-item summary{min-height:60px;padding:0 15px;font-size:14px}.v138-answer{padding:0 15px 16px;font-size:13px}}`;
  doc.head.append(style);
  const section=doc.createElement('section');section.className='v138-faq';section.setAttribute('aria-label','Preguntas antes de reservar');section.innerHTML=`<div class="v138-faq-shell"><div class="v138-faq-copy"><p class="v138-kicker">Antes de reservar</p><h2>Todo claro antes de elegir tu hora.</h2><p class="v138-intro">La reserva está pensada para que puedas organizar tu visita a la farmacia con pocos pasos y sin crear una cuenta.</p><button class="v138-book" type="button">Ver horarios disponibles</button><div class="v138-note"><strong>Privacidad primero.</strong> Los datos personales se solicitan solo cuando vas a confirmar la cita.</div></div><div class="v138-list"><details class="v138-item" open><summary>¿Necesito crear una cuenta?</summary><div class="v138-answer">No. Puedes elegir servicio, profesional y hora directamente desde la ficha pública de la farmacia.</div></details><details class="v138-item"><summary>¿Los horarios que veo son reales?</summary><div class="v138-answer">Sí. La agenda muestra la disponibilidad publicada por la farmacia para cada servicio y profesional. Si un hueco deja de estar disponible, puedes elegir otro antes de confirmar.</div></details><details class="v138-item"><summary>¿Puedo gestionar la cita después?</summary><div class="v138-answer">Sí. Tras reservar puedes volver a “Mi cita” para consultar la reserva, añadirla a tu calendario o cancelarla mediante el acceso privado asociado a esa cita.</div></details><details class="v138-item"><summary>¿Qué ocurre si no encuentro una hora que me encaje?</summary><div class="v138-answer">Prueba otra fecha, servicio o profesional. También puedes utilizar los canales de contacto de la farmacia que aparecen en esta misma ficha.</div></details></div></div>`;
  const go=()=>{const booking=doc.querySelector('#booking,.booking,[data-section="booking"]');if(booking){booking.scrollIntoView({behavior:'smooth',block:'start'});const focusable=booking.querySelector('button,input,select,a[href]');if(focusable)setTimeout(()=>focusable.focus({preventScroll:true}),400)}else win.location.hash='booking'};
  section.querySelector('.v138-book').addEventListener('click',go);
  const confidence=doc.querySelector('.v137-confidence');const booking=doc.querySelector('#booking,.booking,[data-section="booking"]');if(confidence&&confidence.parentNode)confidence.parentNode.insertBefore(section,confidence.nextSibling);else if(booking&&booking.parentNode)booking.parentNode.insertBefore(section,booking);else doc.body.append(section);
  doc.documentElement.dataset.frontend='v138';
  const faqSchema=doc.createElement('script');faqSchema.type='application/ld+json';faqSchema.id='v138-faq-schema';faqSchema.textContent=JSON.stringify({'@context':'https://schema.org','@type':'FAQPage','mainEntity':[{'@type':'Question','name':'¿Necesito crear una cuenta para reservar?','acceptedAnswer':{'@type':'Answer','text':'No. La reserva puede iniciarse desde la ficha pública de la farmacia sin crear una cuenta.'}},{'@type':'Question','name':'¿Puedo gestionar la cita después?','acceptedAnswer':{'@type':'Answer','text':'Sí. Tras reservar, Mi cita permite consultar la reserva, añadirla al calendario o cancelarla mediante su acceso privado.'}}]});doc.head.append(faqSchema);
}
function syncHash(win){try{const h=win.location.hash;if(h!==location.hash)history.replaceState(null,'',location.pathname+location.search+h)}catch{}}
frame.addEventListener('load',()=>{try{const doc=frame.contentDocument,win=frame.contentWindow;injectV138(doc,win);win.addEventListener('hashchange',()=>syncHash(win));syncHash(win);const title=doc.title;if(title)document.title=title.replace(/v137/i,'v138')}catch(e){console.warn('v138 FAQ unavailable',e)}boot.classList.add('hide');setTimeout(()=>boot.remove(),300)});
window.addEventListener('hashchange',()=>{try{if(frame.contentWindow.location.hash!==location.hash)frame.contentWindow.location.hash=location.hash}catch{}});
</script>
