<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedsSocial 2026 · Farmacia v19</title><style>:root{--deep:#103e49;--teal:#18b9bd;--ink:#18313a;--muted:#74868c;--line:#dce8ea;--bg:#f5f8f9}*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.top{padding:18px 24px;background:linear-gradient(120deg,#25c7ca,var(--deep));color:#fff;display:flex;align-items:center;gap:12px}.brand{font-size:30px;font-weight:300}.pill{font-size:11px;border:1px solid #ffffff55;border-radius:99px;padding:6px 9px}.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 72px)}aside{background:var(--deep);color:#fff;padding:18px 12px}.lab{font-size:10px;letter-spacing:.14em;color:#7bdfe1;margin:18px 10px 7px}.nav{display:block;width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:11px 12px;border-radius:8px}.nav.active{background:#ffffff18}main{padding:28px;max-width:1180px;width:100%;margin:auto}.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.hero h1{margin:0;font-size:30px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.card,.table{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 9px 30px #103d480b}.card{padding:20px}.metric b{font-size:30px}.row{display:grid;grid-template-columns:1.4fr .9fr .7fr .7fr 1.1fr;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:center}.head{font-size:11px;font-weight:700;color:var(--muted);background:#f9fbfb}.status{padding:5px 8px;border-radius:99px;font-size:11px;font-weight:700}.draft{background:#fff3d8;color:#9b6500}.published{background:#e4f6ee;color:#127a54}.btn{border:0;border-radius:8px;padding:9px 12px;background:#0e8f97;color:white;font-weight:700;cursor:pointer}.btn.alt{background:#eaf4f5;color:#0e6f76}.drawer{position:fixed;right:0;top:0;height:100%;width:min(460px,100%);background:white;padding:26px;box-shadow:-20px 0 50px #103d4826;transform:translateX(105%);transition:.2s;overflow:auto}.drawer.open{transform:none}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin:0 0 6px}.input{width:100%;border:1px solid #cadadd;border-radius:9px;padding:10px;background:#fff}.notice{margin:12px 0;padding:10px;background:#eef8f8;color:#166b70;border-radius:8px;display:none}.notice.show{display:block}@media(max-width:800px){.shell{display:block}aside{display:none}.grid,.form{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.head{display:none}}</style></head><body><header class="top"><div class="brand">medssocial</div><span class="pill">FARMACIA · 2026 v19</span><span style="margin-left:auto">Preview navegable</span></header><div class="shell"><aside><div class="lab">MI FARMACIA</div><button class="nav active">Resumen</button><div class="lab">OPERACIÓN</div><button class="nav">Suscriptores</button><button class="nav">Eventos</button><button class="nav">Comunicaciones</button><div class="lab">PLATAFORMA</div><button class="nav">Estado del sistema</button></aside><main><div class="hero"><div><h1>Eventos de la farmacia</h1><p class="muted">Crea, edita y publica actividades para tu comunidad.</p></div><button class="btn" id="new">+ Nuevo evento</button></div><div class="grid"><div class="card metric"><span class="muted">Suscriptores</span><br><b>1.284</b></div><div class="card metric"><span class="muted">Próximos eventos</span><br><b id="count">2</b></div><div class="card metric"><span class="muted">Módulos activos</span><br><b>6</b></div></div><div class="table"><div class="row head"><div>EVENTO</div><div>FECHA</div><div>ESTADO</div><div>INSCRITOS</div><div>ACCIONES</div></div><div id="rows"></div></div></main></div><aside class="drawer" id="drawer"><button class="btn alt" id="close" style="float:right">Cerrar</button><p class="muted">EDITOR DE EVENTOS</p><h2 id="title">Nuevo evento</h2><div id="notice" class="notice"></div><form id="form"><input type="hidden" id="id"><div class="form"><div class="field full"><label>Título</label><input class="input" id="name" required></div><div class="field full"><label>Descripción</label><textarea class="input" id="desc" rows="4"></textarea></div><div class="field"><label>Inicio</label><input class="input" id="start" type="datetime-local" required></div><div class="field"><label>Fin</label><input class="input" id="end" type="datetime-local"></div><div class="field"><label>Formato</label><select class="input" id="format"><option value="in_person">Presencial</option><option value="online">Online</option><option value="hybrid">Híbrido</option></select></div><div class="field"><label>Aforo</label><input class="input" id="capacity" type="number" min="1" value="30"></div><div class="field full"><label>Ubicación / enlace</label><input class="input" id="location"></div></div><p><button class="btn" type="submit">Guardar evento</button></p></form></aside><script>let events=[{id:1,title:'Taller de dermocosmética',starts_at:'2026-08-25T18:00',format:'in_person',capacity:30,location:'Farmacia',status:'published',registered:18},{id:2,title:'Jornada de nutrición',starts_at:'2026-09-03T17:30',format:'hybrid',capacity:50,location:'Sala + streaming',status:'draft',registered:0}];const $=x=>document.getElementById(x);function render(){$('rows').innerHTML='';events.forEach(e=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<div><b>${e.title}</b><div class="muted">${e.format==='in_person'?'Presencial':e.format==='online'?'Online':'Híbrido'}</div></div><div>${new Date(e.starts_at).toLocaleString('es-ES')}</div><div><span class="status ${e.status}">${e.status==='published'?'Publicado':'Borrador'}</span></div><div>${e.registered||0}</div><div><button class="btn alt" data-edit="${e.id}">Editar</button> <button class="btn" data-publish="${e.id}">${e.status==='published'?'Borrador':'Publicar'}</button></div>`;$('rows').appendChild(r)});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>open(events.find(e=>e.id==b.dataset.edit)));document.querySelectorAll('[data-publish]').forEach(b=>b.onclick=()=>{const e=events.find(x=>x.id==b.dataset.publish);e.status=e.status==='published'?'draft':'published';render()});$('count').textContent=events.length}function open(e){$('id').value=e?.id||'';$('name').value=e?.title||'';$('desc').value=e?.description||'';$('start').value=e?.starts_at||'';$('end').value=e?.ends_at||'';$('format').value=e?.format||'in_person';$('capacity').value=e?.capacity||30;$('location').value=e?.location||'';$('title').textContent=e?'Editar evento':'Nuevo evento';$('notice').classList.remove('show');$('drawer').classList.add('open')}$('new').onclick=()=>open();$('close').onclick=()=>$('drawer').classList.remove('open');$('form').onsubmit=e=>{e.preventDefault();const id=$('id').value,p={title:$('name').value,description:$('desc').value,starts_at:$('start').value,ends_at:$('end').value,format:$('format').value,capacity:Number($('capacity').value),location:$('location').value};if(id)Object.assign(events.find(x=>x.id==id),p);else events.push({id:Date.now(),...p,status:'draft',registered:0});$('notice').textContent='Guardado en la preview. En staging esta acción usa POST/PATCH /v1/pharmacy/events.';$('notice').classList.add('show');render()};render();</script></body></html>
