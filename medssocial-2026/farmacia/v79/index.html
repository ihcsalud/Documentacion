<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MedsSocial 2026 · Farmacia v79</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f8;color:#17252f;font:13px Inter,system-ui,sans-serif}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#0e1c29;color:white;padding:24px 17px}.brand{font-size:23px;font-weight:850}.brand span{color:#60d0bd}.tag{font-size:11px;color:#91a6b7;margin:6px 0 22px}.nav a{display:block;color:#a9b8c6;text-decoration:none;padding:10px 11px;border-radius:9px}.nav a.active,.nav a:hover{background:#1a2d3e;color:white}.main{padding:30px 36px}.top{display:flex;justify-content:space-between;gap:16px;margin-bottom:18px}.eyebrow{font-size:10px;font-weight:800;color:#158b7a;text-transform:uppercase;letter-spacing:.13em}.h1{font-size:29px;font-weight:850;margin:5px 0}.sub{color:#74818e}.status,.card{background:white;border:1px solid #e1e7ea;border-radius:14px}.status{height:max-content;border-radius:999px;padding:8px 12px;font-size:11px}.grid{display:grid;grid-template-columns:1fr .8fr;gap:14px}.card{padding:17px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.head h3{margin:0}.btn{border:0;border-radius:9px;padding:9px 11px;background:#17314a;color:white;font-weight:800;cursor:pointer}.btn.teal{background:#118c7c}.btn.ghost{background:#eef4f5;color:#17314a}.list{display:grid;gap:8px}.item{display:grid;grid-template-columns:1fr auto;gap:10px;border:1px solid #e7edef;border-radius:10px;padding:11px}.item small{display:block;color:#7e8a94;font-size:10px;margin-top:3px}.pill{font-size:9px;font-weight:800;text-transform:uppercase;padding:5px 7px;border-radius:999px;background:#eef5f6}.pill.ok{background:#eaf8f3;color:#147663}.pill.warn{background:#fff7df;color:#8a6500}.pill.bad{background:#fff0ef;color:#a13d34}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.field{margin:10px 0}.field label{display:block;font-size:10px;font-weight:800;color:#60717d;margin-bottom:5px;text-transform:uppercase}.field input,.field select,.field textarea{width:100%;border:1px solid #dce4e8;border-radius:9px;padding:10px;font:inherit}.field textarea{min-height:90px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.toast{position:fixed;right:20px;bottom:20px;background:#152536;color:white;padding:10px 13px;border-radius:9px;opacity:0}.toast.show{opacity:1}@media(max-width:900px){.grid{grid-template-columns:1fr}}@media(max-width:720px){.app{grid-template-columns:1fr}.main{padding:22px}.row2{grid-template-columns:1fr}.top{flex-direction:column}}</style></head><body><div class="app"><aside class="side"><div class="brand">Meds<span>Social</span></div><div class="tag">Farmacia · Backend 2026</div><nav class="nav"><a href="../v72/index.html#resumen">Resumen</a><a href="../v72/index.html#citas">Citas</a><a href="../v72/index.html#suscriptores">Suscriptores</a><a class="active" href="#">Eventos</a><a href="../v78/index.html">Campañas</a><a href="../v75/index.html">Configuración</a><a href="../v77/index.html#communications">Comunicaciones</a><a href="../v77/index.html#audit">Auditoría</a></nav></aside><main class="main"><div class="top"><div><div class="eyebrow">Contenido · Eventos</div><div class="h1">Agenda de eventos de la farmacia</div><div class="sub">Crea, publica y cancela eventos con el contrato real de Laravel.</div></div><div class="status" id="apiState">Comprobando API…</div></div><div class="grid"><section class="card"><div class="head"><h3>Eventos</h3><button class="btn teal" onclick="clearForm()">Nuevo evento</button></div><div class="list" id="events"></div></section><aside class="card"><div class="head"><h3 id="formTitle">Nuevo evento</h3><button class="btn ghost" onclick="clearForm()">Limpiar</button></div><input type="hidden" id="eventId"><div class="field"><label>Título</label><input id="title" value="Taller de dermocosmética"></div><div class="field"><label>Descripción</label><textarea id="description">Consejos prácticos y demostración de producto.</textarea></div><div class="row2"><div class="field"><label>Inicio</label><input id="starts" type="datetime-local"></div><div class="field"><label>Fin</label><input id="ends" type="datetime-local"></div></div><div class="row2"><div class="field"><label>Formato</label><select id="format"><option value="in_person">Presencial</option><option value="online">Online</option><option value="hybrid">Híbrido</option></select></div><div class="field"><label>Aforo</label><input id="capacity" type="number" value="25"></div></div><div class="field"><label>Ubicación</label><input id="location" value="Sala de consejo"></div><button class="btn teal" id="saveBtn">Guardar evento</button></aside></div></main></div><div class="toast" id="toast"></div><script>const p=new URLSearchParams(location.search),api=p.get('api')||'',tenant=p.get('tenant')||'medssocial.es',member=p.get('member')||'owner-1',$=id=>document.getElementById(id);let rows=[];function H(){return {'X-Medssocial-Tenant':tenant,'X-Pharmacy-Member-Id':member,'Content-Type':'application/json'}}async function R(path,opt={}){const r=await fetch(api+path,{...opt,headers:H()});const j=await r.json();if(!r.ok)throw Error(j.message||('HTTP '+r.status));return j}function T(m){$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}function b(s){return `<span class="pill ${s==='published'?'ok':s==='cancelled'?'bad':'warn'}">${s}</span>`}function render(){$('events').innerHTML=rows.map(x=>`<div class="item"><div><b>${x.title}</b><small>${new Date(x.starts_at).toLocaleString('es-ES')} · ${x.format} · ${x.registered||0}/${x.capacity||'—'}</small><div class="actions"><button class="btn ghost" onclick="edit('${x.id}')">Editar</button><button class="btn ghost" onclick="st('${x.id}','published')">Publicar</button><button class="btn ghost" onclick="st('${x.id}','cancelled')">Cancelar</button></div></div>${b(x.status)}</div>`).join('')}async function load(){const r=await R('/v1/pharmacy/events');rows=r.data||[];render()}function clearForm(){$('eventId').value='';$('formTitle').textContent='Nuevo evento'}window.edit=id=>{const x=rows.find(r=>String(r.id)===String(id));if(!x)return;$('eventId').value=x.id;$('formTitle').textContent='Editar evento';$('title').value=x.title;$('description').value=x.description||'';$('starts').value=(x.starts_at||'').slice(0,16);$('ends').value=(x.ends_at||'').slice(0,16);$('format').value=x.format;$('capacity').value=x.capacity||25;$('location').value=x.location||''};window.st=async(id,status)=>{if(!api){rows.find(x=>String(x.id)===String(id)).status=status;render();return}await R('/v1/pharmacy/events/'+id,{method:'PATCH',body:JSON.stringify({status})});await load()};async function save(){const body={title:$('title').value,description:$('description').value||null,starts_at:$('starts').value,ends_at:$('ends').value||null,format:$('format').value,capacity:Number($('capacity').value)||null,location:$('location').value||null};const id=$('eventId').value;if(!api){T('Preview demo: formulario listo para Laravel');return}await R(id?'/v1/pharmacy/events/'+id:'/v1/pharmacy/events',{method:id?'PATCH':'POST',body:JSON.stringify(body)});T(id?'Evento actualizado':'Evento creado');await load()}$('saveBtn').onclick=save;(async()=>{if(api){try{await fetch(api+'/v1/health');$('apiState').textContent='Laravel conectado';await load();return}catch{}}$('apiState').textContent='Demo segura';const d=new Date(Date.now()+86400000);rows=[{id:'1',title:'Taller de fotoprotección',starts_at:d.toISOString(),format:'in_person',registered:18,capacity:30,status:'published'},{id:'2',title:'Nutrición y vuelta a la rutina',starts_at:new Date(Date.now()+259200000).toISOString(),format:'online',registered:0,capacity:80,status:'draft'}];render()})()</script></body></html>
